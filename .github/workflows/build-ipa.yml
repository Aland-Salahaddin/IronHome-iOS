name: Build Sideloadable IPA (IronHome)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IronHome IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned for Sideloadly)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project IronHome.xcodeproj \
            -scheme IronHome \
            -configuration Release \
            -archivePath build/IronHome.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into Sideloadable .ipa
        run: |
          echo "Packaging Payload for Sideloadly..."
          mkdir -p build/Payload
          cp -R build/IronHome.xcarchive/Products/Applications/IronHome.app build/Payload/
          cd build
          zip -r -q IronHome.ipa Payload
          ls -lh IronHome.ipa
          cd ..

      - name: Upload Sideloadly-Ready IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronHome-Sideloadly-IPA
          path: build/IronHome.ipa
          retention-days: 14
